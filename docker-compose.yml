version: '3.8'

services:
  db:
    #image: postgres:15
    image: postgis/postgis:15-3.3  # <- ¡Importante! Imagen con PostGIS
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

# NUEVO SERVICIO: ChromaDB
  chroma:
    image: ghcr.io/chroma-core/chroma:latest # <- 1. Imagen correcta para el servidor
    volumes:
      - chroma_data:/chroma/.chroma/ # <- 2. Ruta de persistencia actualizada
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - PERSIST_DIRECTORY=/chroma/.chroma/ # <- 4. Indicar a Chroma dónde persistir
    ports:
      - "8001:8000"
  
  # NUEVO SERVICIO
  recommendation_service:
    build:
      context: ./recommendation_service  # Docker buscará el Dockerfile aquí
    volumes:
      - ./recommendation_service:/app
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      chroma:
        condition: service_started
    # No es necesario exponer puertos al exterior si solo Django lo va a llamar,
    # pero puedes hacerlo para pruebas:
    ports:
      - "8080:8080"

  web:
    build: ./core_api
    command: sh -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./core_api:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      recommendation_service:
        condition: service_started
# INFRAESTRUCTURA APISIX
  etcd:
    image: bitnamilegacy/etcd:3.5
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379

  apisix:
    image: apache/apisix:latest
    volumes:
      - ./apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml
    depends_on:
      - etcd
    ports:
      - "9080:9080" # Tu nueva BACKEND_URL usará este puerto
      - "9180:9180" # Admin API para curl

  apisix-dashboard:
    image: apache/apisix-dashboard:latest
    volumes:
      - ./apisix_conf/dashboard_conf.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    ports:
      - "9000:9000" # Acceso visual: http://localhost:9000
    depends_on:
      - etcd
  
  # --- NUEVO SERVICIO: REDIS ---
  redis:
    image: "redis:7-alpine"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- NUEVO SERVICIO: CELERY WORKER ---
  celery_worker:
    build: ./core_api
    # Arranca Celery apuntando a la configuración de tu proyecto 'loom'
    command: celery -A loom worker --loglevel=info
    volumes:
      - ./core_api:/app
    env_file:
      - .env
    environment:
      - DB_HOST=db  # Asegura que sepa dónde está Postgres dentro de Docker
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      recommendation_service:
        condition: service_started

  # --- NUEVO SERVICIO: CELERY BEAT (scheduler) ---
  celery_beat:
    build: ./core_api
    # Ejecuta el scheduler de Celery (beat)
    command: celery -A loom beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./core_api:/app
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      recommendation_service:
        condition: service_started

volumes:
  postgres_data:
  chroma_data:
  redis_data: # <- Añade esto para persistir datos de Redis si es necesario